name: CI
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
  workflow_dispatch:
    inputs:
      major_release:
        description: Run major-release validation
        type: boolean
        default: false
  push:
    tags:
    - v*.0.0
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
    - run: npm install --global npm@11.5.2
    - run: npm ci --ignore-scripts
    - run: npm run typecheck && npm test
    - if: ${{ (github.event_name == 'workflow_dispatch' && inputs.major_release) || contains(github.event.pull_request.labels.*.name, 
        'major-release') || startsWith(github.ref, 'refs/tags/') }}
      run: npm run build
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 10 }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
